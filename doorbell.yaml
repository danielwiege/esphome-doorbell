substitutions:
  device_name: doorbell
  friendly_name: Doorbell

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: danielwiege.doorbell
    version: "3.0"

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback Hotspot"

captive_portal:

logger:

# Enable Home Assistant API
api:

# Enable updates from the ESPHome dashboard
ota:
  - platform: esphome

improv_serial:

web_server:
  port: 80
  version: 3

dashboard_import:
  package_import_url: github://danielwiege/esphome-doorbell/doorbell.yaml@main
  import_full_config: true

time:
  - platform: homeassistant
    id: homeassistant_time

text_sensor:
  - platform: version
    name: Doorbell ESPHome Version
  - platform: wifi_info
    ip_address:
      name: Doorbell IP
    ssid:
      name: Doorbell SSID
    bssid:
      name: Doorbell BSSID

sensor:
  - platform: uptime
    name: Doorbell Uptime
  - platform: wifi_signal
    name: Doorbell WiFi Signal
    update_interval: 60s

globals:
  - id: chime
    type: bool
    restore_value: true
    initial_value: "true"

switch:
  - platform: gpio
    pin:
      number: D1
      inverted: false
    name: Doorbell Relay
    id: relay
    internal: true
    icon: mdi:alarm-bell

  - platform: template
    name: Doorbell Chime Active
    id: chime_active
    restore_mode: DISABLED
    turn_on_action:
      - globals.set:
          id: chime
          value: "true"
    turn_off_action:
      - globals.set:
          id: chime
          value: "false"
    lambda: |-
      return id(chime);

button:
  - platform: restart
    name: Doorbell Restart

binary_sensor:
  - platform: gpio
    pin:
      number: D5
      mode:
        input: true
        pullup: true
      inverted: true
    name: Doorbell
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      then:
        - if:
            condition:
              - switch.is_on: chime_active
            then:
              - switch.turn_on: relay
    on_release:
      then:
        - switch.turn_off: relay

  - platform: status
    name: Status Doorbell
